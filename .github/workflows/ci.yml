name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]

    defaults:
      run:
        working-directory: research-runtime

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --all-groups --locked
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy src tests
      - name: Artifact and Kestra contracts
        run: uv run pytest tests/test_artifact_contract_v2.py tests/test_reports.py tests/test_kestra_flows.py -q
      - name: Full test suite
        run: uv run pytest -q