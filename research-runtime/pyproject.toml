[project]
name = "rand-research-runtime"
version = "0.3.0"
description = "Parallel-safe RanD research runtime with validated artifact and tracker delivery contracts"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "RanD contributors" }]
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.18",
  "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
workspace = []
integrations = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
rand_research = ["schemas/*.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
source = ["src/rand_research"]
branch = true